  <circle cx="96" cy="92" r="8" fill="white" opacity="0.9"/>
  <circle cx="100" cy="88" r="2" fill="#6366f1"/>
  
  <text x="64" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#6366f1" font-family="Inter, sans-serif">ACL</text>
