#阶段2 运行环境
FROM nvidia/cuda:12.4.0-runtime-ubuntu22.04
# 源代码 编译环境
RUN apt-get update && apt-get install -y --no-install-recommends \
    libgomp1 \
    && rm -rf /var/lib/apt/lists/*

RUN  apt-get update && apt-get install -y pkg-config libssl-dev ca-certificates perl libfindbin-libs-perl make gcc && rm -rf /var/lib/apt/lists/*

COPY --from=builder /usr/local/cuda/lib64/libcusparse.so.12 /usr/local/cuda/lib64/
COPY --from=builder /usr/local/cuda/lib64/libcublas.so.12 /usr/local/cuda/lib64/
COPY --from=builder /src /app
